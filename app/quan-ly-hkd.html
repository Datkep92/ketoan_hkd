<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b6bcb">
<title>Quản lý hộ kinh doanh</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#e2e6ea; --text:#15202b; --muted:#68737e;
  --main:#0b6bcb; --main-soft:#e8f1fb; --ok:#1a8f4c; --warn:#a86400; --warn-soft:#fff5e5;
  --bad:#c0272d; --bad-soft:#fdeceb; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 68px)}
h1,h2,h3{margin:0 0 8px;font-weight:650;line-height:1.25}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0 0 10px}
a{color:var(--main)}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.tiny{font-size:12px}
.right{text-align:right}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.pad{padding:12px}

/* top bar */
header#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#fff;border-bottom:1px solid var(--line)}
.hh{display:flex;align-items:center;gap:8px;border:0;background:transparent;font:inherit;
  font-weight:600;color:var(--text);padding:6px 4px;border-radius:10px;max-width:75%}
.dot{width:12px;height:12px;border-radius:50%;background:#999;flex:none}
.car{color:var(--muted);font-size:12px}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font:inherit;font-weight:700;color:var(--muted)}

/* tabs */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:transparent;padding:8px 2px 10px;font:inherit;font-size:11.5px;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab span{font-size:17px;line-height:1}
.tab.on{color:var(--main);font-weight:650}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}
.card.warn{background:var(--warn-soft);border-color:#f0d9b0}
.card.bad{background:var(--bad-soft);border-color:#f3c9c7}
.card.ok{background:#eef8f1;border-color:#c9e6d3}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi>div{flex:1 1 40%;min-width:130px}
.big{font-size:22px;font-weight:700;letter-spacing:-.2px}
.bar{height:8px;border-radius:99px;background:#e9edf1;overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:var(--main);border-radius:99px}
.bar>i.warn{background:#e0952b}
.bar>i.bad{background:var(--bad)}

/* buttons */
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;
  border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 14px;font-weight:600}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:#f2c3c1;color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:7px 10px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--main);padding:6px 8px}

/* lists */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.sel{background:var(--main-soft)}
.empty{padding:18px;text-align:center;color:var(--muted)}

/* inputs */
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font:inherit;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--main-soft);border-color:var(--main)}
.grid2{display:flex;gap:10px}
.grid2>*{flex:1;min-width:0}

/* sell */
.search{display:flex;gap:8px;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pbtn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.pbtn .pn{font-weight:600;font-size:14px;line-height:1.25;margin-bottom:4px}
.pbtn .pp{color:var(--main);font-weight:650;font-size:14px}
.cartrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cartrow:last-child{border-bottom:0}
.cartrow .cn{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700}
.qty b{min-width:22px;text-align:center}
.paybar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);z-index:25;
  background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(12,18,25,.42);display:none}
#sheet.on{display:block}
#sheetBox{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:#fff;
  border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#sheetBox h2{margin-bottom:12px}
.grab{width:44px;height:5px;border-radius:99px;background:#dfe4e9;margin:0 auto 12px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 82px);
  z-index:80;background:#15202b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:.96}

/* print */
#print{display:none}
@media print{
  header#top,nav#tabs,#app,#sheet,#toast,.paybar{display:none!important}
  #print{display:block!important}
  body{background:#fff;padding:0}
  @page{margin:12mm}
}
.pdoc{font-size:13px;color:#000}
.pdoc h2{text-align:center;font-size:16px;margin:0 0 2px}
.pdoc .sub{text-align:center;margin-bottom:10px}
.pdoc table{width:100%;border-collapse:collapse;margin:8px 0}
.pdoc th,.pdoc td{border:1px solid #444;padding:5px 6px;font-size:12.5px;text-align:left;vertical-align:top}
.pdoc th{background:#eee}
.pdoc .r{text-align:right}
.pdoc .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:12.5px}
.pdoc .sign div{text-align:center;width:45%}
</style>
</head>
<body>

<header id="top">
  <button class="hh" data-act="switchHH">
    <span class="dot" id="hhDot"></span>
    <span id="hhName">Chưa có hộ</span>
    <span class="car">▾</span>
  </button>
  <div class="sp"></div>
  <button class="icon" data-act="help" aria-label="Trợ giúp">?</button>
</header>

<main id="app"></main>

<nav id="tabs">
  <button class="tab on" data-route="home"><span>▦</span>Hôm nay</button>
  <button class="tab" data-route="sell"><span>＋</span>Bán hàng</button>
  <button class="tab" data-route="book"><span>≡</span>Sổ sách</button>
  <button class="tab" data-route="tax"><span>%</span>Thuế</button>
  <button class="tab" data-route="menu"><span>☰</span>Menu</button>
</nav>

<div id="sheet"><div id="sheetBox"></div></div>
<div id="print"></div>
<div id="toast"></div>

<script>
'use strict';

/* ============================ tiện ích ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = n => Math.round(Number(n) || 0);
const fmt = n => n0(n).toLocaleString('vi-VN');
const money = n => fmt(n) + ' đ';
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dmy(iso){ if(!iso) return ''; const p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function val(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function numv(id){ const e = document.getElementById(id); return e ? n0(e.value) : 0; }

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ============================ hằng số ============================ */
const GROUPS = [
  { k:'goods',   n:'Phân phối, cung cấp hàng hóa' },
  { k:'service', n:'Dịch vụ, xây dựng không bao thầu NVL' },
  { k:'produce', n:'Sản xuất, vận tải, xây dựng bao thầu NVL' },
  { k:'other',   n:'Hoạt động kinh doanh khác' },
  { k:'rent',    n:'Cho thuê tài sản, đại lý xổ số/bảo hiểm, bán hàng đa cấp' }
];
const GROUP_NAME = k => (GROUPS.find(g => g.k === k) || { n:'Hoạt động kinh doanh khác' }).n;
const SHORT = { goods:'Hàng hóa', service:'Dịch vụ', produce:'Sản xuất', other:'Khác', rent:'Cho thuê' };
const PALETTE = ['#0b6bcb','#1a8f4c','#a86400','#7b3fbf','#c0272d','#0d7d8f','#5a6b00','#b5347a'];

const DEFAULT_POLICY = {
  id: 'policy',
  threshold: 0,          // ngưỡng doanh thu không phải nộp thuế (đồng); 0 = chưa đặt
  vat:  { goods:1, service:5, produce:3, other:2, rent:5 },
  tncn: { goods:0.5, service:2, produce:1.5, other:1, rent:5 },
  bracketBase: 'income', // income = thu nhập sau chi phí, revenue = doanh thu
  brackets: [ { max:3000000000, rate:15 }, { max:50000000000, rate:17 }, { max:0, rate:20 } ],
  reduce30: true,
  reduceLimit: 10000000000,
  reduceYears: [2026, 2027],
  period: 'month'
};

/* ============================ lưu trữ ============================ */
const Persist = (() => {
  const KEY = 'hkd1';
  let db = null, mode = 'ls', timer = null;
  function openDB(){
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const rq = indexedDB.open('hkd-db', 1);
      rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error || new Error('idb'));
    });
  }
  return {
    async init(){ try { db = await openDB(); mode = 'idb'; } catch(e){ mode = 'ls'; } },
    async load(){
      if (mode === 'idb'){
        try {
          const v = await new Promise((res, rej) => {
            const tx = db.transaction('kv', 'readonly');
            const g = tx.objectStore('kv').get(KEY);
            g.onsuccess = () => res(g.result);
            g.onerror = () => rej(g.error);
          });
          if (v) return JSON.parse(v);
        } catch(e){ /* thử localStorage */ }
      }
      try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; }
    },
    save(obj){
      const text = JSON.stringify(obj);
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        let ok = false;
        if (mode === 'idb' && db){
          try {
            const tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').put(text, KEY);
            ok = true;
          } catch(e){ ok = false; }
        }
        if (!ok){
          try { localStorage.setItem(KEY, text); }
          catch(e){ toast('Bộ nhớ đầy — hãy sao lưu rồi xóa bớt dữ liệu cũ'); }
        }
      }, 200);
    },
    mode(){ return mode; }
  };
})();

/* ============================ trạng thái ============================ */
const S = {
  data: {
    households: [], products: [], invoices: [], customers: [],
    expenses: [], payments: [], taxpay: [],
    policy: null, settings: { backupAt: null, onboarded: false }
  },
  hid: null,
  route: 'home',
  cart: [],
  bookMonth: todayISO().slice(0, 7),
  taxYear: new Date().getFullYear(),
  taxMonth: 0
};

const P = () => Object.assign({}, DEFAULT_POLICY, S.data.policy || {});
const hhs = () => S.data.households;
const hh = () => S.data.households.find(h => h.id === S.hid) || null;
const prods = () => S.data.products.filter(p => p.hid === S.hid);
const custs = () => S.data.customers.filter(c => c.hid === S.hid);
const invs = (hid) => S.data.invoices.filter(i => i.hid === (hid || S.hid));

function saveAll(){ Persist.save(S.data); }
function push(store, obj){ S.data[store].push(obj); saveAll(); }

/* ============================ tính toán ============================ */
function revIn(from, to, hid){
  return sum(invs(hid).filter(i => i.date >= from && i.date <= to).map(i => i.total));
}
function expIn(from, to, hid){
  return sum(S.data.expenses.filter(e => e.hid === (hid || S.hid) && e.date >= from && e.date <= to).map(e => e.amount));
}
function monthEnd(y, m){
  const d = new Date(y, m, 0);
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }

/* doanh thu theo nhóm thuế trong khoảng, có phân bổ chiết khấu hóa đơn */
function revByGroup(from, to, hid){
  const out = {}; GROUPS.forEach(g => out[g.k] = 0);
  invs(hid).forEach(inv => {
    if (inv.date < from || inv.date > to) return;
    const gross = inv.subtotal || 0;
    const ratio = gross > 0 ? (inv.total / gross) : 1;
    (inv.lines || []).forEach(l => {
      const k = out[l.group] != null ? l.group : 'other';
      out[k] += (l.qty * l.price) * ratio;
    });
  });
  Object.keys(out).forEach(k => out[k] = n0(out[k]));
  return out;
}

function bracketRate(revYear){
  const r = revYear;
  for (const b of P().brackets){
    if (!b.max || r <= b.max) return b.rate;
  }
  return P().brackets[P().brackets.length - 1].rate;
}

function taxCalc(hid, year, month){
  const isYear = !month || month === 0;
  const from = isYear ? year + '-01-01' : year + '-' + String(month).padStart(2,'0') + '-01';
  const to   = isYear ? year + '-12-31' : monthEnd(year, month);
  const pol = P();

  const byGroup = revByGroup(from, to, hid);
  const revPeriod = sum(Object.values(byGroup));
  const revYear = revIn(year + '-01-01', year + '-12-31', hid);
  const expYear = expIn(year + '-01-01', year + '-12-31', hid);
  const branchNote = revYear > 3000000000
    ? 'Doanh thu năm trên 3 tỷ: năm nay vẫn giữ cách đang áp dụng, từ năm sau phải chuyển sang tính trên thu nhập (thu nhập × thuế suất). Phương pháp đã chọn giữ ổn định 02 năm liên tục.'
    : '';

  const overThreshold = pol.threshold > 0 && revYear > pol.threshold;
  const thresholdSet = pol.threshold > 0;

  // thuế GTGT
  let vat = 0;
  if (overThreshold){
    GROUPS.forEach(g => { vat += byGroup[g.k] * (Number(pol.vat[g.k]) || 0) / 100; });
  }
  vat = n0(vat);

  // TNCN cách A: theo bậc doanh thu năm, quy theo tỷ lệ doanh thu kỳ
  const rateA = bracketRate(revYear);
  const baseA = pol.bracketBase === 'income' ? Math.max(0, revYear - expYear) : revYear;
  let annualA = baseA * rateA / 100;
  let tncnA = 0;
  if (overThreshold && revYear > 0) tncnA = n0(annualA * (revPeriod / revYear));

  // TNCN cách B: tỷ lệ % ngành × doanh thu tính thuế, trong đó doanh thu tính thuế là PHẦN VƯỢT NGƯỠNG
  // (Điều 7 Luật Thuế TNCN 109/2025). Phần ngưỡng của kỳ được chia theo tỷ lệ doanh thu kỳ/năm.
  const allowB = overThreshold && revYear <= 3000000000;
  const thresholdPart = (overThreshold && revYear > 0)
    ? Math.min(revPeriod, pol.threshold * (revPeriod / revYear)) : 0;
  const baseB = overThreshold ? Math.max(0, revPeriod - thresholdPart) : 0;
  const baseByGroup = {}; let tncnB = 0;
  GROUPS.forEach(g => {
    const share = revPeriod > 0 ? (byGroup[g.k] / revPeriod) : 0;
    baseByGroup[g.k] = n0(baseB * share);
    tncnB += baseByGroup[g.k] * (Number(pol.tncn[g.k]) || 0) / 100;
  });
  tncnB = n0(tncnB);

  // giảm 30% (Nghị quyết 43/2026/QH16, Nghị định 398/2026/NĐ-CP: doanh thu đến 10 tỷ)
  const reduceOn = !!pol.reduce30 && (pol.reduceYears || []).indexOf(Number(year)) >= 0 && revYear <= (pol.reduceLimit || 0);
  if (reduceOn){ tncnA = n0(tncnA * 0.7); tncnB = n0(tncnB * 0.7); }

  const paid = sum(S.data.taxpay.filter(t => t.hid === (hid || S.hid) && t.year == year && (isYear || t.month == month)).map(t => t.amount));

  return {
    isYear, from, to, byGroup, revPeriod, revYear, expYear,
    threshold: pol.threshold, thresholdSet, overThreshold,
    vat, tncnA, tncnB, allowB, rateA, baseA, annualA, baseB, baseByGroup, thresholdPart, reduceOn, paid,
    totalA: vat + tncnA, totalB: vat + tncnB, branchNote
  };
}

/* ============================ in ấn ============================ */
function printHtml(html){
  $('#print').innerHTML = html;
  setTimeout(() => window.print(), 60);
}
function docHead(title, extra){
  const h = hh();
  return '<div class="pdoc">'
    + '<h2>' + esc(h ? h.name : '') + '</h2>'
    + '<div class="sub">' + (h && h.address ? esc(h.address) + ' · ' : '') + (h && h.taxCode ? 'MST: ' + esc(h.taxCode) : '') + '</div>'
    + '<h3 class="center">' + esc(title) + '</h3>'
    + (extra ? '<div class="center small">' + esc(extra) + '</div>' : '');
}
function docFoot(){
  const h = hh();
  return '<div class="sign"><div>Người mua / khách hàng<br><br><br>(Ký, ghi rõ họ tên)</div>'
    + '<div>Người bán hàng<br><br><br>' + esc(h ? (h.owner || '') : '') + '</div></div></div>';
}

/* ============================ khung màn hình ============================ */
const VIEWS = {};

VIEWS.setup = function(){
  const pol = P();
  const preset = [
    { v: 1000000000, t: '1 tỷ đồng/năm' },
    { v: 500000000,  t: '500 triệu/năm' },
    { v: 100000000,  t: '100 triệu/năm' }
  ];
  return '<div class="pad">'
    + '<div class="card">'
    + '<h2>Cài đặt lần đầu</h2>'
    + '<p class="muted">Mọi dữ liệu nằm trong máy này. Không có máy chủ, không có tài khoản.</p>'
    + '</div>'
    + '<div class="card">'
    + '<h3>1. Ngưỡng doanh thu không phải nộp thuế</h3>'
    + '<p class="muted small">Chọn theo quy định đang áp dụng với hộ của Sếp, hoặc tự nhập. Có thể sửa lại bất cứ lúc nào.</p>'
    + preset.map(p => '<button class="btn wide" style="margin-bottom:8px" data-act="preset" data-v="' + p.v + '">' + p.t + '</button>').join('')
    + '<label class="f" style="margin-top:6px"><span>Tự nhập (đồng)</span>'
    + '<input type="number" inputmode="numeric" id="setThreshold" value="' + (pol.threshold || '') + '" placeholder="ví dụ 1000000000"></label>'
    + '</div>'
    + '<div class="card">'
    + '<h3>2. Kỳ kê khai</h3>'
    + '<label class="f"><span>Kỳ</span><select id="setPeriod">'

VIEWS.home = function(){
  const h = hh();
  if (!h) return '<div class="pad"><div class="card"><h2>Chưa có hộ kinh doanh</h2>'
    + '<p class="muted">Thêm hộ để bắt đầu.</p>'
    + '<button class="btn primary wide" data-act="addHH">Thêm hộ kinh doanh</button></div></div>';

  const t = todayISO(), ym = t.slice(0, 7), y = t.slice(0, 4);
  const revToday = revIn(t, t), revMonth = revIn(ym + '-01', ym + '-31'), revYear = revIn(y + '-01-01', y + '-12-31');
  const pol = P();
  const th = n0(pol.threshold);
  let gate = '';
  if (th > 0){
    const pct = Math.min(100, th ? (revYear / th * 100) : 0);
    const left = th - revYear;
    const cls = pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : '';
    gate = '<div class="card"><div class="row"><b>Ngưỡng doanh thu ' + esc(y) + '</b><div class="sp"></div><span class="muted small">' + (pct < 100 ? Math.round(pct * 10) / 10 + '%' : 'đã vượt') + '</span></div>'
      + '<div class="bar"><i class="' + cls + '" style="width:' + Math.max(2, pct) + '%"></i></div>'
      + '<div class="muted small">' + money(revYear) + ' / ' + money(th)
      + (left > 0 ? ' · còn ' + money(left) + ' tới ngưỡng' : ' · đã vượt ngưỡng')
      + '</div>'
      + (left > 0 ? '<p class="tiny muted" style="margin:8px 0 0">Lưu ý: doanh thu tính theo cả năm, vượt ngưỡng là phát sinh nghĩa vụ thuế cho kỳ.</p>'
                  : '<p class="tiny" style="margin:8px 0 0;color:var(--bad)">Doanh thu năm đã vượt ngưỡng — hộ phải nộp GTGT và TNCN, và thuộc diện dùng hóa đơn điện tử.</p>')
      + '</div>';
  } else {
    gate = '<div class="card warn"><b>Chưa đặt ngưỡng doanh thu</b>'
      + '<div class="muted small">Vào Menu → Cấu hình chính sách thuế để nhập ngưỡng đang áp dụng.</div></div>';
  }

  const backups = S.data.settings.backupAt;
  const needBackup = !backups || daysBetween(backups.slice(0, 10), t) >= 7;
  const debts = sum(custs().map(c => n0(c.debt)));

  return '<div class="pad">'
    + '<div class="card">'
    + '<div class="row"><div><div class="muted small">Doanh thu hôm nay</div><div class="big">' + money(revToday) + '</div></div>'
    + '<div class="sp"></div><button class="btn primary sm" data-act="route" data-route="sell">Bán hàng</button></div>'
    + '<div class="kpi" style="margin-top:12px">'
    + '<div><div class="muted small">Tháng ' + (ym.slice(5)) + '/' + y + '</div><b>' + money(revMonth) + '</b></div>'
    + '<div><div class="muted small">Cả năm ' + y + '</div><b>' + money(revYear) + '</b></div>'
    + '</div></div>'
    + gate
    + (needBackup ? '<div class="card warn"><div class="row"><div><b>Sao lưu dữ liệu</b><div class="muted small">' + (backups ? 'Lần cuối: ' + dmy(backups.slice(0,10)) : 'Chưa sao lưu lần nào') + '</div></div><div class="sp"></div><button class="btn sm" data-act="backup">Sao lưu</button></div></div>' : '')
    + '<div class="list">'
    + '<div class="li" data-act="route" data-route="book"><div class="main"><div class="name">Sổ sách tháng này</div><div class="sub">Hóa đơn, doanh thu, in bảng kê</div></div><span class="muted">›</span></div>'
    + '<div class="li" data-act="route" data-route="tax"><div class="main"><div class="name">Tính thuế</div><div class="sub">GTGT, TNCN, hai phương án</div></div><span class="muted">›</span></div>'
    + '<div class="li" data-act="route" data-route="customers"><div class="main"><div class="name">Khách nợ</div><div class="sub">' + (debts ? money(debts) : 'Chưa có công nợ') + '</div></div><span class="muted">›</span></div>'
    + '<div class="li" data-act="route" data-route="products"><div class="main"><div class="name">Hàng hóa</div><div class="sub">' + prods().length + ' mặt hàng</div></div><span class="muted">›</span></div>'
    + '</div>'
    + '</div>';
};

VIEWS.tax = function(){
  const y = S.taxYear, m = S.taxMonth;

    + '<div class="sp"></div><b>' + money(r.tncnB) + '</b></div>'

/* ============================ render ============================ */
function render(){
  if (!S.data.settings.onboarded && !hhs().length){
    $('#app').innerHTML = VIEWS.setup();
  } else {
    const v = VIEWS[S.route] || VIEWS.home;
    $('#app').innerHTML = v();
  }
  const h = hh();
  $('#hhName').textContent = h ? h.name : 'Chưa có hộ';
  $('#hhDot').style.background = h ? (h.color || PALETTE[0]) : '#999';
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.route === S.route));
  window.scrollTo(0, 0);
}

function go(route){
  S.route = VIEWS[route] ? route : 'home';
  render();
}

/* ============================ sheet ============================ */
function sheet(html){
  $('#sheetBox').innerHTML = '<div class="grab"></div>' + html;
  $('#sheet').classList.add('on');
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#sheetBox').innerHTML = '';
}

/* ============================ hành động ============================ */
function hhForm(h){
  const x = h || { name:'', owner:'', taxCode:'', address:'', phone:'', group:'goods', color:PALETTE[hhs().length % PALETTE.length], startDate:todayISO() };
  return '<h2>' + (h ? 'Sửa hồ sơ hộ' : 'Thêm hộ kinh doanh') + '</h2>'
    + '<label class="f"><span>Tên hộ kinh doanh *</span><input type="text" id="f_name" value="' + esc(x.name) + '"></label>'
    + '<label class="f"><span>Chủ hộ</span><input type="text" id="f_owner" value="' + esc(x.owner) + '"></label>'
    + '<label class="f"><span>Mã số thuế</span><input type="text" id="f_tax" inputmode="numeric" value="' + esc(x.taxCode) + '"></label>'
    + '<label class="f"><span>Địa chỉ</span><input type="text" id="f_addr" value="' + esc(x.address) + '"></label>'
    + '<label class="f"><span>Điện thoại</span><input type="text" id="f_phone" inputmode="tel" value="' + esc(x.phone) + '"></label>'
    + '<label class="f"><span>Ngành chính (quyết định tỷ lệ thuế mặc định)</span><select id="f_group">'
    + GROUPS.map(g => '<option value="' + g.k + '"' + (x.group === g.k ? ' selected' : '') + '>' + esc(g.n) + '</option>').join('')
    + '</select></label>'
    + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button>'

    + (h ? '<button class="btn danger" data-act="delHH" data-id="' + h.id + '">Xóa hộ</button>' : '')

}

document.addEventListener('click', async (e) => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;

  switch (act){
    case 'route': go(t.dataset.route); break;
    case 'closeSheet': closeSheet(); break;
    case 'help': go('help'); break;

    case 'preset': {
      const v = t.dataset.v;
      if (!S.data.settings.onboarded){
        const el = $('#setThreshold');
        if (el) el.value = v;
      } else {
        const el = $('#pThreshold');
        if (el) el.value = v;
      }
      break;
    }

    case 'doSetup': {
      const th = numv('setThreshold');
      S.data.policy = Object.assign(P(), { threshold: th, period: val('setPeriod') || 'month' });
      const name = val('setName') || 'Hộ kinh doanh của tôi';
      S.data.households.push({
        id: uid(), name, owner:'', taxCode: val('setTax'), address:'', phone:'',
        group: val('setGroup') || 'goods', color: PALETTE[0], startDate: todayISO()
      });
      S.hid = S.data.households[0].id;
      S.data.settings.onboarded = true;
      saveAll();
      go('home');
      break;
    }

    case 'switchHH': {
      const list = hhs();
      sheet('<h2>Chọn hộ kinh doanh</h2>'
        + (list.length ? '<div class="list">' + list.map(h =>
            '<div class="li ' + (h.id === S.hid ? 'sel' : '') + '" data-act="pickHH" data-id="' + h.id + '">'
            + '<span class="dot" style="background:' + esc(h.color || '#999') + '"></span>'
            + '<div class="main"><div class="name">' + esc(h.name) + '</div><div class="sub">' + esc(h.taxCode || 'chưa có MST') + '</div></div>'
            + (h.id === S.hid ? '<span class="muted">đang dùng</span>' : '') + '</div>').join('') + '</div>' : '')
        + '<button class="btn primary wide" data-act="addHH">＋ Thêm hộ kinh doanh</button>');
      break;
    }
    case 'pickHH': S.hid = id; S.cart = []; closeSheet(); render(); break;
    case 'addHH': closeSheet(); sheet(hhForm(null)); break;
    case 'editHH': closeSheet(); sheet(hhForm(hh())); break;
    case 'saveHH': {
      const name = val('f_name');
      if (!name) { toast('Cần nhập tên hộ'); break; }
      const data = {
        name, owner: val('f_owner'), taxCode: val('f_tax'), address: val('f_addr'),
        phone: val('f_phone'), group: val('f_group')
      };
      if (id){
        const h = S.data.households.find(x => x.id === id);
        Object.assign(h, data);
      } else {
        const h = Object.assign({ id: uid(), color: PALETTE[hhs().length % PALETTE.length], startDate: todayISO() }, data);
        S.data.households.push(h);
        S.hid = h.id;
      }
      saveAll(); closeSheet(); render(); toast('Đã lưu hồ sơ');
      break;
    }
    case 'delHH': {
      if (!confirm('Xóa hộ này cùng toàn bộ dữ liệu của hộ? Không khôi phục được.')) break;
      S.data.households = S.data.households.filter(x => x.id !== id);
      ['products','invoices','customers','expenses','payments','taxpay'].forEach(k => {
        S.data[k] = S.data[k].filter(x => x.hid !== id);
      });
      if (S.hid === id) S.hid = hhs().length ? hhs()[0].id : null;
      saveAll(); closeSheet(); render();
      break;
    }

    /* hàng hóa */
    case 'addProduct': {
      const h = hh();
      sheet('<h2>Thêm hàng hóa</h2>'
        + '<label class="f"><span>Tên hàng *</span><input type="text" id="g_name"></label>'
        + '<div class="grid2"><label class="f"><span>Đơn vị tính</span><input type="text" id="g_unit" placeholder="cái, kg, ly..."></label>'
        + '<label class="f"><span>Nhóm thuế</span><select id="g_group">'
        + GROUPS.map(g => '<option value="' + g.k + '"' + (h && h.group === g.k ? ' selected' : '') + '>' + esc(SHORT[g.k]) + '</option>').join('')
        + '</select></label></div>'
        + '<div class="grid2"><label class="f"><span>Giá bán</span><input type="number" inputmode="numeric" id="g_price" value="0"></label>'
        + '<label class="f"><span>Giá vốn</span><input type="number" inputmode="numeric" id="g_cost" value="0"></label></div>'
        + '<label class="f"><span>Tồn kho hiện tại</span><input type="number" inputmode="numeric" id="g_stock" value="0"></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveProduct">Lưu</button></div>');
      break;
    }
    case 'editProduct': {
      const p = S.data.products.find(x => x.id === id);
      if (!p) break;
      sheet('<h2>Sửa hàng hóa</h2>'
        + '<label class="f"><span>Tên hàng *</span><input type="text" id="g_name" value="' + esc(p.name) + '"></label>'
        + '<div class="grid2"><label class="f"><span>Đơn vị tính</span><input type="text" id="g_unit" value="' + esc(p.unit || '') + '"></label>'
        + '<label class="f"><span>Nhóm thuế</span><select id="g_group">'
        + GROUPS.map(g => '<option value="' + g.k + '"' + (p.group === g.k ? ' selected' : '') + '>' + esc(SHORT[g.k]) + '</option>').join('')
        + '</select></label></div>'
        + '<div class="grid2"><label class="f"><span>Giá bán</span><input type="number" inputmode="numeric" id="g_price" value="' + n0(p.price) + '"></label>'
        + '<label class="f"><span>Giá vốn</span><input type="number" inputmode="numeric" id="g_cost" value="' + n0(p.cost) + '"></label></div>'
        + '<label class="f"><span>Tồn kho hiện tại</span><input type="number" inputmode="numeric" id="g_stock" value="' + n0(p.stock) + '"></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn danger" data-act="delProduct" data-id="' + p.id + '">Xóa</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveProduct" data-id="' + p.id + '">Lưu</button></div>');
      break;
    }
    case 'saveProduct': {
      const name = val('g_name');
      if (!name) { toast('Cần nhập tên hàng'); break; }
      const data = {
        name, unit: val('g_unit'), group: val('g_group') || 'goods',
        price: numv('g_price'), cost: numv('g_cost'), stock: numv('g_stock')
      };
      if (id){
        Object.assign(S.data.products.find(x => x.id === id), data);
      } else {
        S.data.products.push(Object.assign({ id: uid(), hid: S.hid }, data));
      }
      saveAll(); closeSheet(); render(); toast('Đã lưu hàng hóa');
      break;
    }
    case 'delProduct': {
      if (!confirm('Xóa mặt hàng này?')) break;
      S.data.products = S.data.products.filter(x => x.id !== id);
      saveAll(); closeSheet(); render();
      break;
    }

    /* bán hàng */
    case 'add': {
      const p = S.data.products.find(x => x.id === id);
      if (!p) break;
      const line = S.cart.find(l => l.pid === p.id);
      if (line) line.qty++;
      else S.cart.push({ pid: p.id, name: p.name, price: n0(p.price), qty: 1, group: p.group || 'goods', unit: p.unit || '' });
      render();
      break;
    }
    case 'inc': { S.cart[Number(t.dataset.i)].qty++; render(); break; }
    case 'dec': {
      const i = Number(t.dataset.i);
      S.cart[i].qty--;
      if (S.cart[i].qty <= 0) S.cart.splice(i, 1);
      render();
      break;
    }
    case 'rm': { S.cart.splice(Number(t.dataset.i), 1); render(); break; }

    case 'checkout': {
      const total = sum(S.cart.map(l => l.qty * l.price));
      const cs = custs();
      sheet('<h2>Thu tiền</h2>'
        + '<div class="card"><div class="row"><div class="main">Tổng tiền hàng</div><div class="sp"></div><b style="font-size:20px">' + money(total) + '</b></div></div>'
        + '<label class="f"><span>Giảm giá (đồng)</span><input type="number" inputmode="numeric" id="c_discount" value="0"></label>'
        + '<label class="f"><span>Hình thức</span><select id="c_method">'
        + '<option value="cash">Tiền mặt</option><option value="transfer">Chuyển khoản</option><option value="debt">Ghi nợ</option>'
        + '</select></label>'
        + '<label class="f"><span>Khách hàng (bắt buộc khi ghi nợ)</span><select id="c_cust">'
        + '<option value="">Khách lẻ</option>'
        + cs.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('')
        + '</select></label>'
        + '<button class="btn ghost" data-act="addCustomerFromSell">＋ Thêm khách mới</button>'
        + '<label class="f"><span>Ghi chú</span><input type="text" id="c_note"></label>'
        + '<div class="row" style="margin-top:8px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveInvoice">Lưu & in phiếu</button></div>');
      break;
    }
    case 'saveInvoice': {
      if (!S.cart.length) { toast('Giỏ hàng trống'); break; }
      const subtotal = sum(S.cart.map(l => l.qty * l.price));
      const discount = Math.min(numv('c_discount'), subtotal);
      const total = subtotal - discount;
      const method = val('c_method') || 'cash';
      const custId = val('c_cust');
      if (method === 'debt' && !custId) { toast('Ghi nợ phải chọn khách hàng'); break; }
      const cust = S.data.customers.find(c => c.id === custId);
      const count = invs().length + 1;
      const inv = {
        id: uid(), hid: S.hid, code: 'HD' + String(count).padStart(3, '0'), date: todayISO(),
        lines: S.cart.map(l => ({ pid: l.pid, name: l.name, qty: l.qty, price: l.price, group: l.group })),
        subtotal, discount, total, method,
        customerId: custId || '', custName: cust ? cust.name : '', note: val('c_note')
      };
      S.data.invoices.push(inv);
      // trừ tồn kho
      inv.lines.forEach(l => {
        const p = S.data.products.find(x => x.id === l.pid);
        if (p && p.stock != null) p.stock = n0(p.stock) - l.qty;
      });
      // ghi nợ
      if (method === 'debt' && cust) cust.debt = n0(cust.debt) + total;
      saveAll();
      S.cart = [];
      closeSheet();
      render();
      printInvoice(inv);
      toast('Đã lưu hóa đơn ' + inv.code);
      break;
    }
    case 'printInvoice': {
      const inv = S.data.invoices.find(x => x.id === id);
      if (inv) printInvoice(inv);
      break;
    }
    case 'delInvoice': {
      const inv = S.data.invoices.find(x => x.id === id);
      if (!inv) break;
      if (!confirm('Xóa hóa đơn ' + inv.code + '? Tồn kho và công nợ sẽ được trả lại.')) break;
      inv.lines.forEach(l => {
        const p = S.data.products.find(x => x.id === l.pid);
        if (p && p.stock != null) p.stock = n0(p.stock) + l.qty;
      });
      if (inv.method === 'debt' && inv.customerId){
        const c = S.data.customers.find(x => x.id === inv.customerId);
        if (c) c.debt = Math.max(0, n0(c.debt) - inv.total);
      }
      S.data.invoices = S.data.invoices.filter(x => x.id !== id);
      saveAll(); render();
      break;
    }
    case 'printBook': {
      const m = S.bookMonth, y = Number(m.slice(0,4)), mo = Number(m.slice(5));
      const from = m + '-01', to = m + '-' + daysInMonth(y, mo);
      const byGroup = revByGroup(from, to);
      const rows = GROUPS.filter(g => byGroup[g.k] > 0).map(g =>
        '<tr><td>' + esc(g.n) + '</td><td class="r">' + money(byGroup[g.k]) + '</td></tr>').join('');
      printHtml(docHead('BẢNG KÊ DOANH THU THEO NHÓM NGÀNH', 'Kỳ: tháng ' + mo + '/' + y)
        + '<table><tr><th>Nhóm ngành</th><th class="r">Doanh thu</th></tr>' + rows
        + '<tr><th>Tổng cộng</th><th class="r">' + money(sum(Object.values(byGroup))) + '</th></tr></table>'
        + '<div class="small">Người lập bảng kê cam đoan số liệu trên là đúng.</div>'
        + docFoot());
      break;
    }
    case 'printTax': {
      const r = taxCalc(S.hid, S.taxYear, S.taxMonth);
      const per = r.isYear ? 'Cả năm ' + S.taxYear : 'Tháng ' + S.taxMonth + '/' + S.taxYear;
      printHtml(docHead('BẢNG TÍNH THUẾ', 'Kỳ: ' + per)
        + '<table><tr><th>Chỉ tiêu</th><th class="r">Số tiền</th></tr>'
        + '<tr><td>Doanh thu kỳ</td><td class="r">' + money(r.revPeriod) + '</td></tr>'
        + '<tr><td>Doanh thu lũy kế năm</td><td class="r">' + money(r.revYear) + '</td></tr>'
        + '<tr><td>Chi phí trong năm</td><td class="r">' + money(r.expYear) + '</td></tr>'
        + '<tr><td>Thuế GTGT</td><td class="r">' + money(r.vat) + '</td></tr>'
        + '<tr><td>Thuế TNCN (cách A — theo bậc)</td><td class="r">' + money(r.tncnA) + '</td></tr>'
        + '<tr><td>Thuế TNCN (cách B — theo tỷ lệ %)</td><td class="r">' + money(r.tncnB) + '</td></tr>'
        + '<tr><th>Tổng theo cách A</th><th class="r">' + money(r.totalA) + '</th></tr>'
        + '<tr><td>Đã nộp</td><td class="r">' + money(r.paid) + '</td></tr>'
        + '</table>'
        + '<div class="small">Số liệu lập từ hóa đơn ghi trong phần mềm, dùng để tham khảo khi kê khai.</div>'
        + docFoot());
      break;
    }

    /* khách hàng */
    case 'addCustomer':
    case 'addCustomerFromSell': {
      if (act === 'addCustomerFromSell') closeSheet();
      sheet('<h2>Thêm khách hàng</h2>'
        + '<label class="f"><span>Tên khách *</span><input type="text" id="k_name"></label>'
        + '<label class="f"><span>Điện thoại</span><input type="text" id="k_phone" inputmode="tel"></label>'
        + '<label class="f"><span>Nợ hiện tại (đồng)</span><input type="number" inputmode="numeric" id="k_debt" value="0"></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveCustomer">Lưu</button></div>');
      break;
    }
    case 'saveCustomer': {
      const name = val('k_name');
      if (!name) { toast('Cần nhập tên khách'); break; }
      S.data.customers.push({ id: uid(), hid: S.hid, name, phone: val('k_phone'), debt: numv('k_debt') });
      saveAll(); closeSheet(); render(); toast('Đã thêm khách');
      break;
    }
    case 'editCustomer': {
      const c = S.data.customers.find(x => x.id === id);
      if (!c) break;
      sheet('<h2>Sửa khách hàng</h2>'
        + '<label class="f"><span>Tên khách *</span><input type="text" id="k_name" value="' + esc(c.name) + '"></label>'
        + '<label class="f"><span>Điện thoại</span><input type="text" id="k_phone" value="' + esc(c.phone || '') + '"></label>'
        + '<label class="f"><span>Nợ hiện tại (đồng)</span><input type="number" inputmode="numeric" id="k_debt" value="' + n0(c.debt) + '"></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn danger" data-act="delCustomer" data-id="' + c.id + '">Xóa</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveCustomerEdit" data-id="' + c.id + '">Lưu</button></div>');
      break;
    }
    case 'saveCustomerEdit': {
      const c = S.data.customers.find(x => x.id === id);
      if (!c) break;
      c.name = val('k_name') || c.name;
      c.phone = val('k_phone');
      c.debt = numv('k_debt');
      saveAll(); closeSheet(); render();
      break;
    }
    case 'delCustomer': {
      if (!confirm('Xóa khách hàng này?')) break;
      S.data.customers = S.data.customers.filter(x => x.id !== id);
      saveAll(); closeSheet(); render();
      break;
    }
    case 'payDebt': {
      const c = S.data.customers.find(x => x.id === id);
      if (!c) break;
      sheet('<h2>Thu nợ — ' + esc(c.name) + '</h2>'
        + '<div class="card"><div class="row"><div class="main">Đang nợ</div><div class="sp"></div><b>' + money(c.debt) + '</b></div></div>'
        + '<label class="f"><span>Số tiền thu</span><input type="number" inputmode="numeric" id="d_amount" value="' + n0(c.debt) + '"></label>'
        + '<label class="f"><span>Ngày</span><input type="date" id="d_date" value="' + todayISO() + '"></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="savePay" data-id="' + c.id + '">Lưu</button></div>');
      break;
    }
    case 'savePay': {
      const c = S.data.customers.find(x => x.id === id);
      if (!c) break;
      const amt = Math.min(numv('d_amount'), n0(c.debt));
      if (amt <= 0) { toast('Số tiền không hợp lệ'); break; }
      c.debt = n0(c.debt) - amt;
      S.data.payments.push({ id: uid(), hid: S.hid, customerId: c.id, amount: amt, date: val('d_date') || todayISO(), note: '' });
      saveAll(); closeSheet(); render(); toast('Đã thu ' + money(amt));
      break;
    }

    /* chi phí */
    case 'addExpense': {
      sheet('<h2>Thêm chi phí</h2>'
        + '<label class="f"><span>Loại chi phí</span><input type="text" id="e_cat" placeholder="mặt bằng, điện nước, lương..."></label>'
        + '<label class="f"><span>Số tiền</span><input type="number" inputmode="numeric" id="e_amount" value="0"></label>'
        + '<label class="f"><span>Ngày</span><input type="date" id="e_date" value="' + todayISO() + '"></label>'
        + '<label class="f"><span>Ghi chú</span><input type="text" id="e_note"></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveExpense">Lưu</button></div>');
      break;
    }
    case 'saveExpense': {
      const amount = numv('e_amount');
      if (amount <= 0) { toast('Cần nhập số tiền'); break; }
      S.data.expenses.push({ id: uid(), hid: S.hid, category: val('e_cat') || 'Chi phí', amount, date: val('e_date') || todayISO(), note: val('e_note') });
      saveAll(); closeSheet(); render();
      break;
    }
    case 'delExpense': {
      S.data.expenses = S.data.expenses.filter(x => x.id !== id);
      saveAll(); render();
      break;
    }

    /* thuế */
    case 'addTaxPay': {
      const r = taxCalc(S.hid, S.taxYear, S.taxMonth);
      sheet('<h2>Ghi nhận đã nộp thuế</h2>'
        + '<div class="card"><div class="row"><div class="main">Còn phải nộp (cách A)</div><div class="sp"></div><b>' + money(Math.max(0, r.totalA - r.paid)) + '</b></div></div>'
        + '<label class="f"><span>Số tiền đã nộp</span><input type="number" inputmode="numeric" id="t_amount" value="' + Math.max(0, r.totalA - r.paid) + '"></label>'
        + '<label class="f"><span>Ngày nộp</span><input type="date" id="t_date" value="' + todayISO() + '"></label>'
        + '<label class="f"><span>Ghi chú</span><input type="text" id="t_note" placeholder="số biên lai, kênh nộp..."></label>'
        + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="saveTaxPay">Lưu</button></div>');
      break;
    }
    case 'saveTaxPay': {
      const amt = numv('t_amount');
      if (amt <= 0) { toast('Cần nhập số tiền'); break; }
      S.data.taxpay.push({ id: uid(), hid: S.hid, year: S.taxYear, month: S.taxMonth, amount: amt, date: val('t_date') || todayISO(), note: val('t_note') });
      saveAll(); closeSheet(); render(); toast('Đã ghi nhận');
      break;
    }

    /* cấu hình */
    case 'savePolicy': {
      const p = P();
      p.threshold = numv('pThreshold');
      GROUPS.forEach(g => {
        p.vat[g.k] = Number(($('#pVat_' + g.k) || {}).value || 0);
        p.tncn[g.k] = Number(($('#pTncn_' + g.k) || {}).value || 0);
      });
      p.bracketBase = val('pBase') || 'income';
      p.brackets = [
        { max: 3000000000, rate: Number(val('pRate1')) || 0 },
        { max: 50000000000, rate: Number(val('pRate2')) || 0 },
        { max: 0, rate: Number(val('pRate3')) || 0 }
      ];
      p.reduce30 = !!($('#pReduce30') || {}).checked;
      p.reduceLimit = numv('pReduceLimit');
      p.period = val('pPeriod') || 'month';
      S.data.policy = p;
      saveAll(); render(); toast('Đã lưu cấu hình');
      break;
    }
    case 'resetPolicy': {
      if (!confirm('Khôi phục cấu hình thuế về mặc định?')) break;
      S.data.policy = Object.assign({}, DEFAULT_POLICY);
      saveAll(); render();
      break;
    }

    /* sao lưu */
    case 'backup': {
      const text = JSON.stringify({ app:'quan-ly-hkd', version:1, exportedAt: new Date().toISOString(), data: S.data }, null, 1);
      const blob = new Blob([text], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sao-luu-hkd-' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      S.data.settings.backupAt = new Date().toISOString();
      saveAll();
      toast('Đã tạo tệp sao lưu — hãy cất vào Files');
      render();
      break;
    }
    case 'restore': {
      sheet('<h2>Nhập dữ liệu đã sao lưu</h2>'
        + '<p class="muted small">Chọn tệp .json đã sao lưu. Dữ liệu hiện có sẽ bị thay thế.</p>'
        + '<input type="file" id="restoreFile" accept=".json,application/json">'
        + '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Hủy</button><div class="sp"></div>'
        + '<button class="btn primary" data-act="doRestore">Nhập</button></div>');
      break;
    }
    case 'doRestore': {
      const f = $('#restoreFile');
      if (!f || !f.files || !f.files[0]) { toast('Chưa chọn tệp'); break; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const obj = JSON.parse(reader.result);
          const d = obj && obj.data ? obj.data : obj;
          if (!d || !Array.isArray(d.households)) throw new Error('bad');
          if (!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng dữ liệu trong tệp?')) return;
          S.data = Object.assign(S.data, d);
          S.hid = hhs().length ? hhs()[0].id : null;
          saveAll(); closeSheet(); render(); toast('Đã nhập dữ liệu');
        } catch(e){ toast('Tệp không hợp lệ'); }
      };
      reader.readAsText(f.files[0]);
      break;
    }
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'sellSearch'){
    S._sellQ = t.value;
    const box = t.closest('.pad');
    if (box){
      render();
      const s = $('#sellSearch');
      if (s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }
    return;
  }
  if (t.id === 'bookMonth'){ S.bookMonth = t.value || S.bookMonth; render(); return; }
  if (t.id === 'taxYear'){ S.taxYear = Number(t.value) || new Date().getFullYear(); render(); return; }
  if (t.id === 'taxMonth'){ S.taxMonth = Number(t.value) || 0; render(); return; }
});

document.querySelectorAll('#tabs .tab').forEach(b => {
  b.addEventListener('click', () => go(b.dataset.route));
});

/* ============================ in phiếu ============================ */
function printInvoice(inv){
  const h = hh() || {};
  const rows = inv.lines.map(l =>
    '<tr><td>' + esc(l.name) + '</td><td class="r">' + l.qty + '</td><td class="r">' + money(l.price) + '</td><td class="r">' + money(l.qty * l.price) + '</td></tr>').join('');
  printHtml('<div class="pdoc">'
    + '<h2>' + esc(h.name || '') + '</h2>'
    + '<div class="sub">' + (h.address ? esc(h.address) + '<br>' : '') + (h.taxCode ? 'MST: ' + esc(h.taxCode) : '') + '</div>'
    + '<h3 class="center">PHIẾU BÁN HÀNG</h3>'
    + '<div class="small">Số: ' + esc(inv.code) + ' · Ngày: ' + dmy(inv.date) + (inv.custName ? ' · Khách: ' + esc(inv.custName) : '') + '</div>'
    + '<table><tr><th>Hàng hóa</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr>' + rows
    + '<tr><th colspan="3">Cộng tiền hàng</th><th class="r">' + money(inv.subtotal) + '</th></tr>'
    + (inv.discount ? '<tr><td colspan="3">Giảm giá</td><td class="r">-' + money(inv.discount) + '</td></tr>' : '')
    + '<tr><th colspan="3">Khách phải trả</th><th class="r">' + money(inv.total) + '</th></tr></table>'
    + '<div class="small">Hình thức: ' + (inv.method === 'debt' ? 'Ghi nợ' : inv.method === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt')
    + ' · Phiếu này không thay thế hóa đơn điện tử.</div>'
    + docFoot());
}

/* ============================ khởi động ============================ */
(async function init(){
  await Persist.init();
  const d = await Persist.load();
  if (d && d.households){
    S.data = Object.assign(S.data, d);
    S.data.settings = Object.assign({ backupAt:null, onboarded:false }, d.settings || {});
    S.hid = hhs().length ? hhs()[0].id : null;
  }
  if (!S.data.policy) S.data.policy = Object.assign({}, DEFAULT_POLICY);
  if (!S.data.settings.onboarded && hhs().length) S.data.settings.onboarded = true;
  render();
})();
</script>
</body>
